<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>SpendTrack</title>
    <link rel="icon" type="image/jpeg" href="/logo.jpg" />
    <script>
      (function() {
        // Global error handler: in development shows stack, in production shows safe user-friendly recovery UI
        var isDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

        function showSafeErrorBanner(title, details) {
          var errDiv = document.getElementById('debug-error-banner');
          if (!errDiv) {
            errDiv = document.createElement('div');
            errDiv.id = 'debug-error-banner';
            errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:999999;background:#0d1117;color:#f1f5f9;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,-apple-system,sans-serif;';
            document.body.appendChild(errDiv);
          }
          if (isDev) {
            errDiv.innerHTML = '<div style="max-width:600px;background:#1e293b;padding:24px;border-radius:16px;border:1px solid #334155;font-family:monospace;font-size:12px;color:#f87171;word-break:break-all;">' +
              '<h3 style="color:#ef4444;font-size:16px;margin-bottom:12px;font-weight:bold;">' + title + '</h3>' + details +
              '<br><br><button onclick="window.location.reload()" style="background:#3b82f6;color:#fff;border:none;padding:8px 16px;border-radius:8px;cursor:pointer;font-weight:bold;">Reload</button></div>';
          } else {
            errDiv.innerHTML = '<div style="max-width:380px;text-align:center;background:#1e293b;padding:32px 24px;border-radius:24px;border:1px solid #334155;box-shadow:0 20px 25px -5px rgba(0,0,0,0.5);">' +
              '<div style="width:48px;height:48px;background:rgba(239,68,68,0.15);color:#ef4444;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:24px;">⚠️</div>' +
              '<h3 style="color:#f8fafc;font-size:18px;margin-bottom:8px;font-weight:bold;">Something unexpected happened</h3>' +
              '<p style="color:#94a3b8;font-size:13px;line-height:1.5;margin-bottom:24px;">SpendTrack encountered a temporary issue while starting up. Your data is safely stored in the cloud.</p>' +
              '<button onclick="window.location.reload()" style="background:#3b82f6;color:#fff;border:none;padding:12px 24px;border-radius:12px;cursor:pointer;font-weight:bold;font-size:13px;width:100%;">Restart SpendTrack</button>' +
              '</div>';
          }
        }

        window.addEventListener('error', function(e) {
          showSafeErrorBanner('⚠️ Startup Error', (e.message || 'Unknown Error') + '<br><br>' + (e.error && e.error.stack ? e.error.stack : ''));
        });

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          showSafeErrorBanner('⚠️ Unhandled Rejection', reason ? (reason.stack || reason.message || String(reason)) : 'Unknown');
        });

        try {
          var theme = localStorage.getItem('theme') || 'light';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
